[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd mk/mk/Fittrack && npm install"]

[phases.build]
cmds = ["cd mk/mk/Fittrack && npm run build && cp -r dist/* ../django_backend/"]

[start]
cmd = "cd mk/mk/Fittrack/django_backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn fittrack.wsgi:application --bind 0.0.0.0:$PORT"
