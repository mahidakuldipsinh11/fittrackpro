name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: curl -sf --max-time 90 https://fittrackpro-backend-vig5.onrender.com/api/health/ || echo "ping failed (retry next cycle)"