services:
  - type: web
    name: fittrackpro-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd mk/mk/Fittrack/django_backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn fittrack.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set in Render Dashboard (Secret: Supabase Postgres URL)
      - key: SECRET_KEY
        sync: false          # set in Render Dashboard (Secret: Django secret key)
      - key: RAZORPAY_KEY_ID
        sync: false          # set in Render Dashboard (rzp_test_... or rzp_live_...)
      - key: RAZORPAY_KEY_SECRET
        sync: false          # set in Render Dashboard (secret key)
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11"
