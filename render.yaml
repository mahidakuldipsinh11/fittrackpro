services:
  - type: web
    name: fittrackpro-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd mk/mk/Fittrack/django_backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn fittrack.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set in Render Dashboard (Secret: Supabase Postgres URL)
      - key: SECRET_KEY
        sync: false          # set in Render Dashboard (Secret: Django secret key)
      - key: RAZORPAY_KEY_ID
        sync: false          # set in Render Dashboard (rzp_test_... or rzp_live_...)
      - key: RAZORPAY_KEY_SECRET
        sync: false          # set in Render Dashboard (secret key)
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SITE_URL
        value: "https://fittrackpro-sand.vercel.app"
      - key: EMAIL_HOST_USER
        value: "fittrackpro.noreply@gmail.com"
      # Gmail App Password (Google Account > Security > App passwords).
      # Set this value in the Render Dashboard (same as django_backend/.env EMAIL_HOST_PASSWORD).
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # EmailJS (https://www.emailjs.com) — sends as fittrackpro.noreply@gmail.com
      # over HTTPS 443 with no Google verification needed.
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "FitTrack Pro <onboarding@resend.dev>"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
